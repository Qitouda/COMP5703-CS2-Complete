server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 50m;
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 3s;
    set $backend_origin http://backend:8000;

    location = /__frontend_health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # The browser's existing API paths stay unchanged, including PDF downloads.
    location /v1/ {
        proxy_pass $backend_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_send_timeout 90s;
    }

    location = /health {
        proxy_pass $backend_origin/health;
        proxy_set_header Host $http_host;
    }

    # Resolve the optional service at request time so it may be left disabled.
    location /assistant/ {
        set $assistant_origin http://assistant:8020;
        proxy_pass $assistant_origin;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_cache off;
        proxy_connect_timeout 3s;
        proxy_read_timeout 180s;
        proxy_intercept_errors on;
        error_page 502 503 504 = @assistant_unavailable;
    }

    location @assistant_unavailable {
        default_type application/json;
        return 503 '{"error":"The assistant is not configured on this server."}';
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Application report routes must also open correctly after a browser refresh.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
